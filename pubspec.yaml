name: goodwin
description: "Wholesale warehouse pickup platform for resellers."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^18.0.0
  flutter_riverpod: ^3.4.2
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  intl: ^0.20.3
  uuid: ^4.6.0
  equatable: ^2.1.0
  image_picker: ^1.2.3
  cached_network_image: ^3.4.1
  pdf: ^3.13.0
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
