name: goodwin
description: "Wholesale warehouse pickup platform for resellers."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^18.0.0
  flutter_riverpod: ^3.4.2
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  intl: ^0.20.3
  uuid: ^4.6.0
  equatable: ^2.1.0
  image_picker: ^1.2.3
  cached_network_image: ^3.4.1
  pdf: ^3.13.0
  printing: ^5.15.0
  google_fonts: ^8.2.1
  lucide_icons_flutter: ^3.1.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/goodwin_logo.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
